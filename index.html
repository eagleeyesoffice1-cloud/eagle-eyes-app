<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102d53"><link rel="manifest" href="manifest.webmanifest"><title>Eagle Eyes Restoration | Field Operations</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#152942;background:#eef3f8}*{box-sizing:border-box}body{margin:0}header{background:#102d53;color:white;padding:18px 20px;display:flex;align-items:center;justify-content:space-between}header .brandlogo{width:105px;max-width:28vw;height:66px;object-fit:contain;margin-right:10px}header .brandwrap{display:flex;align-items:center}header strong{font-size:19px}header small{display:block;color:#cbdcf2}main{max-width:1100px;margin:auto;padding:18px}nav{display:flex;gap:8px;overflow:auto;padding:10px 0 18px}button,.btn{cursor:pointer;background:#153e70;color:white;border:0;border-radius:9px;padding:11px 14px;font-weight:650;font-size:14px}button.secondary{background:#e5edf6;color:#153e70}button.orange{background:#ed7d24}button:disabled{opacity:.45}nav button.active{background:#ed7d24}.panel{background:white;border:1px solid #dce5ef;border-radius:14px;padding:17px;margin-bottom:15px;box-shadow:0 3px 10px #102d5308}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.metric{background:#173e6d;color:white;padding:20px;border-radius:12px}.metric b{display:block;font-size:29px}.metric small{color:#cbdcf2}label{display:block;font-size:12px;font-weight:700;color:#52657b;margin:12px 0 5px}input,textarea,select{width:100%;padding:11px;border:1px solid #c8d5e4;border-radius:8px;font:inherit}textarea{min-height:85px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.muted{color:#65788d;font-size:13px}.pill{display:inline-block;border-radius:20px;background:#e9f2ff;color:#1a4c86;padding:5px 9px;font-size:12px}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.photo{border:1 const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const KEY='eer-demo-v1';let jobs=JSON.parse(localStorage.getItem(KEY)||'[]'), current=null,page='dashboard',role='owner';const save=()=>localStorage.setItem(KEY,JSON.stringify(jobs));const uid=()=>Math.random().toString(36).slice(2,10);const fmt=s=>s?new Date(s).toLocaleString(): 'Not scheduled';function visibleJobs(){return role==='tech'?jobs.filter(j=>j.tech==='Demo Technician'):jobs}function go(p){if(['finance','alerts'].includes(p)&&role==='tech')return;page=p;document.querySelectorAll('main section').forEach(x=>x.classList.toggle('hidden',x.id!==p));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render()}$('#nav').onclick=e=>{let b=e.target.closest('button');if(b)go(b.dataset.page)};$('#role').onchange=e=>{role=e.target.value;current=null;go('dashboard')};function render(){document.getElementById('financeTab').classList.toggle('hidden',role==='tech');document.getElementById('alertsTab').classList.toggle('hidden',role==='tech');if(role==='tech'&&['finance','alerts'].includes(page)){go('dashboard');return}renderFinance();renderAlerts();const list=visibleJobs();$('#dashboard').innerHTML=`<h1>Operations Dashboard</h1><div class="grid"><div class="metric"><b>${list.length}</b><small>Total Jobs</small></div><div class="metric"><b>${list.filter(j=>j.status==='In Progress').length}</b><small>In Progress</small></div><div class="metric"><b>${list.filter(j=>j.status==='Scheduled').length}</b><small>Scheduled</small></div><div class="metric"><b>${list.filter(j=>j.report).length}</b><small>Reports Finalized</small></div></div><div class="panel" style="margin-top:15px"><h2>Recent Jobs</h2>${list.length?list.slice().reverse().slice(0,6).map(j=>jobRow(j)).join(''):'<p class="muted">No jobs yet. Create your first demo job.</p>'}<button class="orange" onclick="go('jobs');newJob()">+ New Job</button></div>`;$('#calendar').innerHTML=`<h1>Schedule</h1><div class="panel">${list.filter(j=>j.date).sort((a,b)=>a.date.localeCompare(b.date)).map(j=>`<div class="job" onclick="openJob('${j.id}')"><b>${esc(j.name)}</b><p class="muted">${esc(fmt(j.date))} · ${esc(j.tech||'Unassigned')} · ${esc(j.status)}</p></div>`).join('')||'<p>No scheduled appointments.</p>'}</div>`;renderTeam();renderJobs()}

{id:'owner1',name:'Jason',email:'',role:'owner',active:true},

function addStaff(){
 if(role==='tech')return;
 let name=$('#staffName').value.trim(),email=$('#staffEmail').value.trim(),r=$('#staffRole').value;
 if(!name)return alert('Enter an employee name.');

function jobRow(j){return `<div class="job" onclick="openJob('${j.id}')"><b>${esc(j.name||'Unnamed customer')}</b> <span class="pill">${esc(j.status)}</span><p class="muted">${esc(j.number)} · ${esc(j.address)} · ${esc(j.service)}</p></div>`}function renderJobs(){let j=jobs.find(x=>x.id===current);if(!j){$('#jobs').innerHTML=`<h1>Job Files</h1><div class="panel"><button class="orange" onclick="newJob()" ${role==='tech'?'disabled':''}>+ Create Job</button><label>Search customers, addresses or job numbers</label><input id="search" placeholder="Search jobs..." oninput="filterJobs(this.value)"><div id="joblist">${visibleJobs().map(jobRow).join('')||'<p class="muted">No jobs yet.</p>'}</div></div>`;return}const locked=j.report;$('#jobs').innerHTML=`<div class="actions noprint"><button class="secondary" onclick="current=null;renderJobs()">← All Jobs</button><span class="pill">${esc(j.status)}</span>${locked?'<span class="pill">PDF finalized</span>':''}</div><div class="panel" id="report"><div class="printonly"><img src="eagle-eyes-logo.jpg" alt="Eagle Eyes Restoration logo" style="width:230px;max-width:100%;height:auto"><h1>Eagle Eyes Restoration</h1><p>Job Completion Report • 629-214-0053</p></div><h2>Job ${esc(j.number)}</h2><div class="grid"><div><label>Customer name</label><input id="name" value="${esc(j.name)}" ${locked?'disabled':''}><label>Phone</label><input id="phone" type="tel" value="${esc(j.phone)}" ${locked?'disabled':''}><a href="tel:${esc(j.phone.replace(/[^\d+]/g,''))}">📞 Call customer</a><label>Email</label><input id="email" type="email" value="${esc(j.email)}" ${locked?'disabled':''}><a href="mailto:${esc(j.email)}">✉️ Email customer</a></div><div><label>Property address</label><input id="address" value="${esc(j.address)}" ${locked?'disabled':''}><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(j.address)}">📍 Open directions</a><label>Service</label><select id="service" ${locked?'disabled':''}>${['Water Damage','Fire Damage','Mold Remediation','Sewage Cleanup','Biohazard Cleanup','Crawlspace Remediation','Contents Cleaning','Inspection'].map(x=>`<option ${j.service===x?'selected':''}>${x}</option>`).join('')}</select><label>Assigned technician</label><select id="tech" ${locked||role==='tech'?'disabled':''}><option value="">Unassigned</option><option ${j.tech==='Demo Technician'?'selected':''}>Demo Technician</option></select><label>Appointment</label><input id="date" type="datetime-local" value="${esc(j.date)}" ${locked?'disabled':''}></div></div><label>Work description, moisture readings and notes</label><textarea id="notes" ${locked?'disabled':''}>${esc(j.notes)}</textarea><div class="actions noprint">${!locked?`<button onclick="updateJob()">Save Job</button><button class="secondary" onclick="setStatus('Scheduled')">Scheduled</button><button class="secondary" onclick="setStatus('In Progress')">Start Job</button>`:''}<button class="secondary" onclick="sms('appointment')">Appointment Text</button><button class="secondary" onclick="sms('onway')">On My Way Text</button><button class="secondary" onclick="sms('review')">Google Review Text</button></div><h2 style="margin-top:22px">Job Photos <span class="pill" id="count">Loading...</span></h2><div class="noprint">${!locked?'<label>Upload multiple photos (Before / During / After)</label><select id="stage"><option>Before</option><option>During</option><option>After</option></select><input id="upload" type="file" accept="image/*" multiple onchange="uploadPhotos(event)"><p class="muted">Photos are stored locally in this browser. Large batches may exceed device storage; upload in smaller groups for this demo.</p>':''}</div><div id="photos" class="photos"></div><div class="actions noprint" style="margin-top:24px">${!locked?'<button class="orange" onclick="finishJob()">Done — Create PDF</button>':'<button onclick="printReport()">Open PDF / Print</button><button class="secondary" onclick="emailReport()">Email Report Instructions</button>'}</div></div>`;loadPhotos(j.id)}function filterJobs(q){$('#joblist').innerHTML=visibleJobs().filter(j=>[j.name,j.address,j.number,j.phone].join(' ').toLowerCase().includes(q.toLowerCase())).map(jobRow).join('')||'<p>No matches.</p>'}function newJob(){if(role==='tech')return;let j={id:uid(),number:'EER-'+new Date().getFullYear()+'-'+String(jobs.length+1).padStart(4,'0'),name:'',phone:'',email:'',address:'',service:'Water Damage',tech:'',date:'',notes:'',status:'New',report:false};jobs.push(j);save();current=j.id;renderJobs()}function openJob(id){current=id;go('jobs')}function updateJob(){let j=jobs.find(x=>x.id===current);if(j.report)return;for(let f of ['name','phone','email','address','service','tech','date','notes']){let el=$('#'+f);if(el&&!el.disabled)j[f]=el.value}save();renderJobs();alert('Job saved locally.')}function setStatus(s){updateJob();let j=jobs.find(x=>x.id===current);j.status=s;save();renderJobs()}function sms(type){let j=jobs.find(x=>x.id===current);if(!j.phone)return alert('Add and save a customer phone number first.');let text=type==='appointment'?`Eagle Eyes Restoration: Your appointment is scheduled for ${fmt(j.date)} at ${j.address}. Please reply CONFIRM or contact 629-214-0053 to request a change.`:type==='onway'?`Eagle Eyes Restoration: ${j.tech||'Your technician'} is on the way to ${j.address}. Call 629-214-0053 with questions. Technician photo will be included once messaging integration is configured.`:`Thank you for choosing Eagle Eyes Restoration! We would appreciate an honest Google review: [INSERT VERIFIED REVIEW LINK]`;if(type==='review')return alert('Add your verified Google review link before sending real review requests. Preview:\n\n'+text);if(!confirm('Open your SMS app with this draft? No message will be sent automatically.\n\n'+text))return;location.href='sms:'+encodeURIComponent(j.phone)+'?body='+encodeURIComponent(text)}function finishJob(){updateJob();let j=jobs.find(x=>x.id===current);if(!j.name||!j.address)return alert('Customer name and address are required.');if(!confirm('Finalize this job? This will lock editing and enable printing/saving the PDF.'))return;j.report=true;j.status='Completed';j.completed=new Date().toISOString();save();renderJobs();alert('Job finalized. Tap Open PDF / Print and select Save as PDF.')}function printReport(){window.print()}function emailReport(){alert('First select Open PDF / Print → Save as PDF. Then attach the saved PDF in your email app. Direct email attachments require a future server integration.')}let dbPromise;function db(){return dbPromise??=new Promise((resolve,reject)=>{let r=indexedDB.open('eer-photos-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}async function photoList(jobId){let d=await db();return new Promise((res,rej)=>{let r=d.transaction('photos').objectStore('photos').getAll();r.onsuccess=()=>res(r.result.filter(p=>p.jobId===jobId));r.onerror=()=>rej(r.error)})}async function uploadPhotos(e){let j=jobs.find(x=>x.id===current), files=[...e.target.files];if(j.report)return;let d=await db(),count=0;for(let f of files){if(!f.type.startsWith('image/'))continue;let data=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});await new Promise((res,rej)=>{let r=d.transaction('photos','readwrite').objectStore('photos').put({id:uid(),jobId:j.id,stage:$('#stage').value,name:f.name,data,at:new Date().toISOString()});r.onsuccess=res;r.onerror=()=>rej(r.error)});count++}alert(count+' photos saved on this device.');loadPhotos(j.id)}async function loadPhotos(id){try{let photos=await photoList(id);if(current!==id)return;$('#count').textContent=photos.length+' photos';$('#photos').innerHTML=photos.map(p=>`<div class="photo"><img src="${p.data}" alt="Job photo"><div><b>${esc(p.stage)}</b><br>${esc(p.name)}</div></div>`).join('')||'<p class="muted">No photos uploaded.</p>'}catch(e){$('#photos').textContent='Photo storage unavailable in this browser.'}}
// Local-only owner financial demonstration. Production use requires server-enforced authentication.
const FINKEY='eer-finance-v1';let finances=JSON.parse(localStorage.getItem(FINKEY)||'{}');const finSave=()=>localStorage.setItem(FINKEY,JSON.stringify(finances));const dollars=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'});const finNum=x=>Math.max(0,Number(x)||0);
function finRecord(id){return finances[id]??={estimate:0,discount:0,invoice:'',dueDate:'',payments:[],notes:'',fileName:''}}
function finTotals(f){let discounted=finNum(f.estimate)*(1-Math.min(100,finNum(f.discount))/100),collected=(f.payments||[]).reduce((a,p)=>a+finNum(p.amount),0);return {discounted,collected,due:Math.max(0,discounted-collected)}}
function agingDays(d){if(!d)return null;let due=new Date(d+'T00:00:00');if(Number.isNaN(due.getTime()))return null;let today=new Date();today.setHours(0,0,0,0);return Math.max(0,Math.round((today-due)/86400000))}function agingLabel(days){if(days===null)return 'Due date missing';if(days===0)return 'Current';if(days<=30)return '1–30 days';if(days<=60)return '31–60 days';if(days<=90)return '61–90 days';if(days<=120)return '91–120 days';return '120+ days'}
function renderFinance(){let el=$('#finance');if(!el)return;if(role==='tech'){el.innerHTML='<p>Financial records unavailable to field technicians.</p>';return}let totals=jobs.reduce((a,j)=>{let t=finTotals(finRecord(j.id));a.invoice+=t.discounted;a.collected+=t.collected;a.due+=t.due;return a},{invoice:0,collected:0,due:0});let buckets={'Current':0,'1–30 days':0,'31–60 days':0,'61–90 days':0,'91–120 days':0,'120+ days':0,'Due date missing':0};jobs.forEach(j=>{let f=finRecord(j.id),t=finTotals(f);if(f.invoice&&t.due>0)buckets[agingLabel(agingDays(f.dueDate))]+=t.due});let agingHtml=Object.entries(buckets).map(([name,value])=>`<div class="metric"><b>${dollars(value)}</b><small>${name}</small></div>`).join('');el.innerHTML=`<h1>Owner Financial Dashboard</h1><div class="actions"><button class="secondary" onclick="go('alerts')">View 30/60/90 Day Alerts</button><button class="secondary" onclick="exportFinanceBackup()">Export Financial Demo Backup</button></div><p class="muted">Private device-only demo. Do not upload real estimates or financial records. Role selection is NOT secure authentication.</p><div class="grid"><div class="metric"><b>${dollars(totals.invoice)}</b><small>Net Estimates</small></div><div class="metric"><b>${dollars(totals.collected)}</b><small>Collected</small></div><div class="metric"><b>${dollars(totals.due)}</b><small>Outstanding</small></div></div><div class="panel" style="margin-top:15px"><h2>Accounts Receivable Aging (invoiced balances only)</h2><p class="muted">Aging is measured from the invoice due date. Payments reduce the balance without changing its age. Missing due dates are shown separately.</p><div class="grid">${agingHtml}</div><h2 style="margin-top:20px">Job Financial Records</h2>${jobs.map(j=>{let f=finRecord(j.id),t=finTotals(f);return `<div class="job"><b>${esc(j.number)} · ${esc(j.name||'Unnamed customer')}</b><p class="muted">Net ${dollars(t.discounted)} · Collected ${dollars(t.collected)} · Due ${dollars(t.due)} · ${f.invoice?esc(agingLabel(agingDays(f.dueDate))):'Not invoiced'}</p><button onclick="editFinance('${j.id}')">Manage estimate & collections</button></div>`}).join('')||'<p>Create a job first to attach an estimate.</p>'}</div><div id="financeEditor"></div>`;}
function editFinance(id){if(role==='tech')return;let j=jobs.find(x=>x.id===id);if(!j)return;let f=finRecord(id),t=finTotals(f);$('#financeEditor').innerHTML=`<div class="panel"><h2>${esc(j.number)} — ${esc(j.name||'Customer')}</h2><label>Estimate amount ($)</label><input id="finEstimate" type="number" min="0" step="0.01" value="${finNum(f.estimate)}"><label>Discount (%) — owner approval required</label><input id="finDiscount" ${role==='owner'?'':'disabled'} type="number" min="0" max="100" step="0.01" value="${finNum(f.discount)}"><label>Invoice number</label><input id="finInvoice" value="${esc(f.invoice)}"><label>Invoice due date</label><input id="finDueDate" type="date" value="${esc(f.dueDate||'')}"><label>Collection notes</label><textarea id="finNotes">${esc(f.notes)}</textarea><label>Estimate document (PDF or image; local demo only)</label><input id="finFile" type="file" accept="application/pdf,image/*"><p class="muted">Saved file: ${esc(f.fileName||'None')}</p><div class="actions"><button onclick="saveFinance('${id}')">Save Financial Record</button>${f.fileName?`<button class="secondary" onclick="downloadEstimate('${id}')">Download Uploaded Estimate</button>`:''}</div><h3>Payments received</h3><label>Payment amount ($)</label><input id="finPayment" type="number" min="0.01" step="0.01" placeholder="Enter payment"><label>Payment method / reference</label><input id="finMethod" placeholder="Check, card, cash, ACH / reference"><button class="orange" onclick="addPayment('${id}')">Record Payment</button><p><b>Net amount:</b> ${dollars(t.discounted)} · <b>Collected:</b> ${dollars(t.collected)} · <b>Balance:</b> ${dollars(t.due)}</p>${(f.payments||[]).map(p=>`<p class="muted">${esc(p.date)} — ${dollars(p.amount)} — ${esc(p.method)}</p>`).join('')}</div>`;$('#financeEditor').scrollIntoView({behavior:'smooth',block:'start'})}
async function saveFinance(id){if(role==='tech')return;let f=finRecord(id);f.estimate=finNum($('#finEstimate').value);if(role==='owner')f.discount=Math.min(100,finNum($('#finDiscount').value));f.invoice=$('#finInvoice').value;f.dueDate=$('#finDueDate').value;f.notes=$('#finNotes').value;let file=$('#finFile').files[0];if(file){if(file.size>12*1024*1024)return alert('Demo upload limit: 12 MB per estimate.');try{let d=await db();await new Promise((res,rej)=>{let tx=d.transaction('photos','readwrite');let r=tx.objectStore('photos').put({id:'estimate-'+id,jobId:'__estimate__',name:file.name,blob:file,stage:'Estimate'});r.onsuccess=res;r.onerror=()=>rej(r.error)});f.fileName=file.name}catch(e){return alert('Could not store estimate on this device: '+e.message)}}finSave();renderFinance();editFinance(id);alert('Financial record saved on this device only.')}
async function downloadEstimate(id){if(role==='tech')return;let d=await db(),r=d.transaction('photos').objectStore('photos').get('estimate-'+id);r.onsuccess=()=>{let p=r.result;if(!p?.blob)return alert('Estimate file not found on this device.');let url=URL.createObjectURL(p.blob),a=document.createElement('a');a.href=url;a.download=p.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
function addPayment(id){if(role==='tech')return;let amount=Number($('#finPayment').value);if(!Number.isFinite(amount)||amount<=0)return alert('Enter a valid payment amount.');let f=finRecord(id);f.payments??=[];f.payments.push({amount,method:$('#finMethod').value,date:new Date().toLocaleDateString()});finSave();renderFinance();editFinance(id)}

// On-device reminder center. Recomputed from invoice due dates on every open/refresh.
const ALERTKEY='eer-alert-ack-v1';
function getAcknowledged(){try{return JSON.parse(localStorage.getItem(ALERTKEY)||'{}')}catch{return {}}}
function alertEntries(){let out=[];for(const j of jobs){let f=finRecord(j.id),t=finTotals(f);if(!f.invoice||!f.dueDate||t.due<=0)continue;let days=agingDays(f.dueDate);if(days===null)continue;let milestone=days>=90?90:days>=60?60:days>=30?30:0;if(milestone)out.push({j,f,days,milestone,balance:t.due,key:j.id+'|'+f.invoice+'|'+f.dueDate+'|'+milestone})}return out.sort((a,b)=>b.days-a.days)}
function acknowledgeAlert(key){let a=getAcknowledged();a[key]=new Date().toISOString();localStorage.setItem(ALERTKEY,JSON.stringify(a));renderAlerts()}
function renderAlerts(){let el=$('#alerts');if(!el)return;if(role==='tech'){el.innerHTML='';return}let all=alertEntries(),ack=getAcknowledged(),pending=all.filter(a=>!ack[a.key]);let count=all.length;document.querySelector('[data-page="alerts"]').textContent='Collection Alerts'+(pending.length?' ('+pending.length+')':'');el.innerHTML=`<h1>Collection Alerts</h1><div class="panel"><p><b>${pending.length} needs review</b> · ${count} invoices at least 30 days overdue</p><p class="muted">Reminders are checked when this app opens or refreshes. This version does not send push notifications, texts or emails. Acknowledging a reminder does not change the invoice or payment status.</p><button class="secondary" onclick="renderAlerts()">Refresh alerts</button></div>${all.length?all.map(a=>`<div class="panel"><span class="pill">${a.days} days overdue · ${a.milestone}+ day reminder</span> ${ack[a.key]?'<span class="pill">Reviewed</span>':''}<h3>${esc(a.j.name||'Customer')} · ${esc(a.f.invoice)}</h3><p>${esc(a.j.number)} · ${esc(a.j.address)}</p><p><b>${dollars(a.balance)} outstanding</b> · Due ${esc(a.f.dueDate)}</p><div class="actions"><button onclick="go('finance');editFinance('${a.j.id}')">Open financial record</button>${!ack[a.key]?`<button class="secondary" onclick="acknowledgeAlert('${a.key}')">Mark reminder reviewed</button>`:''}</div></div>`).join(''):'<div class="panel"><p>No invoiced balances have reached 30 days overdue.</p></div>'}`}
function exportFinanceBackup(){if(role==='tech')return;let payload={format:'eer-financial-demo-backup',exportedAt:new Date().toISOString(),jobs:jobs.map(j=>({id:j.id,number:j.number,name:j.name,status:j.status})),finances};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='eer-finance-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});render();</script></body></html>
